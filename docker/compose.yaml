# Local development stack for RESOLVE: PostgreSQL + Qdrant.
#
#   docker compose -f docker/compose.yaml up -d     # start
#   docker compose -f docker/compose.yaml down      # stop (keeps data)
#   docker compose -f docker/compose.yaml down -v   # stop + delete data
#
# Credentials/ports deliberately match .env (POSTGRES_DSN, QDRANT_URL).
name: resolve

services:
  postgres:
    image: postgres:16
    container_name: resolve-postgres
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolve"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: resolve-qdrant
    ports:
      - "6333:6333"   # REST / HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
