# Pre-commit hooks for RESOLVE.
# Install once with:  uv run pre-commit install
# Run on all files:   uv run pre-commit run --all-files
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # The committed routing golden set (3,000 rows, PLAN §7.8) is ~0.8 MB.
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy runs in the project environment (via uv), so the hook sees the exact
  # same dependencies, plugins and config as local `make lint` and CI. This
  # avoids the "passes locally, fails in the isolated hook" divergence (the
  # isolated hook lacks pytest, which makes test decorators look untyped).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
