name: Eval gate

# Runs the deterministic evaluation gate on every PR (PLAN §12.5). A regression in a
# measured capability (deadline calculator, PII offsets) fails the job and blocks merge.
# Retrieval recall needs Qdrant and is skipped in CI (the gate degrades gracefully).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Deterministic eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run evaluation gate
        env:
          GEMINI_API_KEY: ci-dummy-gemini-key
          GROQ_API_KEY: ci-dummy-groq-key
        run: uv run python -m resolve.eval.runners.gate

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-summary
          path: eval/reports/summary.*
